<!DOCTYPE html>
<html lang="fr" id="html-tag" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (localStorage.getItem('theme') === 'light') { document.documentElement.classList.remove('dark'); }
        if (localStorage.getItem('access_granted') !== 'true') { window.location.replace("index.html"); }
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        * { transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, backdrop-filter 0.3s ease !important; }
        
        /* Correction du fond : on utilise min-h-screen sur le html/body */
        html, body { 
            min-height: 100%; 
            margin: 0; 
            padding: 0;
            background-color: #f6f6f6; /* Fallback light */
        }
        
        .dark html, .dark body { background-color: #0a0510; }

        body { font-family: 'Inter', sans-serif; }
        .logo-minimal { font-family: 'Playfair Display', serif; letter-spacing: -0.05em; }
        .date-col { min-width: 100px; font-variant-numeric: tabular-nums; }
        
        /* On laisse de la place pour le footer fixe */
        main { padding-bottom: 150px; }
        
        .violet-glow { text-shadow: 0 0 12px rgba(168, 85, 247, 0.4); }
        .absolute-center { position: absolute; left: 50%; transform: translateX(-50%); }

        #transition-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999;
            transition: opacity 0.4s ease-in-out !important; opacity: 1;
        }

        .page-content {
            opacity: 0; transform: translateY(10px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out !important;
        }
        .page-content.visible { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="antialiased text-[13px] bg-[#f6f6f6] text-[#333] dark:bg-[#0a0510] dark:text-[#e9d5ff] min-h-screen">

    <div id="transition-layer" class="bg-[#f6f6f6] dark:bg-[#0a0510]"></div>

    <div id="main-wrapper" class="page-content min-h-screen flex flex-col">
        <nav class="flex justify-between items-center px-6 py-8 sticky top-0 bg-[#f6f6f6]/80 dark:bg-[#0a0510]/80 backdrop-blur-md z-50 border-b border-gray-200 dark:border-purple-900/10">
            <div class="logo-minimal text-3xl font-normal dark:text-purple-400">Alex.</div>
            <div class="flex gap-4 text-[10px] uppercase tracking-[0.2em] text-gray-500 dark:text-purple-300/60 font-medium">
                <button onclick="toggleDarkMode()" class="hover:text-black dark:hover:text-purple-300">[ <span id="mode-text">Dark</span> ]</button>
                <button onclick="logout()" class="hover:text-red-500 uppercase">Quitter</button>
            </div>
        </nav>

        <main class="max-w-4xl mx-auto mt-20 px-6 flex-grow w-full">
            <div class="flex flex-col gap-12">
                
                <div class="flex flex-col md:flex-row gap-2 md:gap-0">
                    <div class="date-col text-gray-400 dark:text-purple-500/50 pt-1 font-medium italic">Status</div>
                    <div class="flex-1">
                        <div class="py-1 px-2 group rounded-sm cursor-default hover:bg-black/5 dark:hover:bg-purple-900/10 transition-all">
                            <span class="dark:text-purple-400 violet-glow group-hover:translate-x-1 inline-block transition-transform uppercase tracking-widest">Système de verrouillage activé.</span>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row gap-2 md:gap-0">
                    <div class="date-col text-gray-400 dark:text-purple-500/50 pt-1 font-medium italic">Project_01</div>
                    <div class="flex-1">
                        <div class="py-1 px-2 group rounded-sm cursor-default hover:bg-black/5 dark:hover:bg-purple-900/10 transition-all">
                            <span class="block font-medium dark:text-purple-200">Creative Direction & Digital Architecture</span>
                            <span class="text-gray-500 dark:text-purple-300/40 text-[11px] leading-relaxed">Exploration des interfaces brutalistes et des systèmes interactifs sécurisés. 2026 Edition.</span>
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <footer class="fixed bottom-0 left-0 w-full flex items-center px-6 py-8 text-[10px] text-gray-400 bg-[#f6f6f6]/90 dark:bg-[#0a0510]/90 backdrop-blur-md border-t border-gray-200 dark:border-purple-900/10 z-50">
            <div class="flex gap-4 font-medium flex-1"><span>© 2026 ALEX</span></div>
            <div class="absolute-center italic tracking-[0.5em] font-light text-gray-500 dark:text-purple-400/80 text-[12px]">a/k</div>
            <div class="flex-1 text-right"><span id="local-time" class="font-mono text-[11px] dark:text-purple-300/80">--:--:--</span></div>
        </footer>
    </div>

    <script>
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('transition-layer').style.opacity = "0";
                document.getElementById('main-wrapper').classList.add('visible');
            }, 50);
        };

        function updateClock() { document.getElementById('local-time').textContent = new Date().toLocaleTimeString('fr-FR', { hour12: false }); }
        setInterval(updateClock, 1000); updateClock();

        function toggleDarkMode() {
            const isDark = document.getElementById('html-tag').classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('mode-text').textContent = isDark ? 'Light' : 'Dark';
        }

        function logout() {
            document.getElementById('transition-layer').style.opacity = "1";
            document.getElementById('main-wrapper').style.opacity = "0";
            localStorage.removeItem('access_granted');
            setTimeout(() => { window.location.replace("index.html"); }, 400);
        }
        document.getElementById('mode-text').textContent = document.documentElement.classList.contains('dark') ? 'Light' : 'Dark';
    </script>
</body>
</html>
