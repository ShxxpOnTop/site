<!DOCTYPE html>
<html lang="fr" id="html-tag" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function applyTheme() {
            const currentTheme = localStorage.getItem('theme');
            if (currentTheme === 'light') { document.documentElement.classList.remove('dark'); }
            else { document.documentElement.classList.add('dark'); }
        }
        applyTheme();
        if (localStorage.getItem('access_granted') !== 'true') { window.location.replace("index.html"); }
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        * { transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, backdrop-filter 0.3s ease !important; }
        html, body { height: 100%; margin: 0; background-color: #f6f6f6; }
        .dark html, .dark body { background-color: #0a0510; }
        body { font-family: 'Inter', sans-serif; display: flex; flex-direction: column; }
        .logo-minimal { font-family: 'Playfair Display', serif; letter-spacing: -0.05em; }
        .date-col { min-width: 140px; font-variant-numeric: tabular-nums; }
        
        .status-pulse {
            width: 7px; height: 7px; border-radius: 50%;
            display: inline-block; box-shadow: 0 0 8px currentColor;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        .theme-rotate { animation: switch-icon 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes switch-icon {
            0% { transform: rotate(0deg) scale(1); opacity: 1; }
            50% { transform: rotate(90deg) scale(0.5); opacity: 0; }
            51% { transform: rotate(-90deg) scale(0.5); opacity: 0; }
            100% { transform: rotate(0deg) scale(1); opacity: 1; }
        }

        #transition-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 9999;
            transition: opacity 0.4s ease-in-out !important; opacity: 1;
        }

        .page-content {
            opacity: 0; transform: translateY(10px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out !important;
            flex: 1; display: flex; flex-direction: column;
        }
        .page-content.visible { opacity: 1; transform: translateY(0); }

        /* Animation de survol */
        .project-item { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease !important; }
        .project-group:hover .project-item { transform: translateX(10px); opacity: 1 !important; }
        .project-group:hover .project-date { color: #8b5cf6; }
    </style>
</head>
<body class="antialiased text-[13px] bg-[#f6f6f6] text-[#333] dark:bg-[#0a0510] dark:text-[#e9d5ff]">

    <div id="transition-layer" class="bg-[#f6f6f6] dark:bg-[#0a0510]"></div>

    <div id="main-wrapper" class="page-content">
        <nav class="relative flex justify-between items-center px-6 h-24 sticky top-0 bg-[#f6f6f6]/80 dark:bg-[#0a0510]/80 backdrop-blur-md z-50 border-b border-gray-200 dark:border-purple-900/10">
            <div class="flex items-center gap-8">
                <div class="logo-minimal text-3xl font-normal dark:text-purple-400 translate-y-[2px]">Alex.</div>
                <div class="hidden md:flex gap-6 text-[10px] uppercase tracking-[0.2em] font-medium">
                    <a href="home.html" class="text-black dark:text-white border-b border-black dark:border-purple-500">Index</a>
                    <a href="dashboard.html" class="text-gray-400 hover:text-black dark:hover:text-purple-300 transition-colors">Dashboard</a>
                </div>
            </div>
            
            <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center text-[10px] uppercase tracking-[0.25em] font-medium text-green-600 dark:text-purple-400/90">
                <span class="status-pulse bg-green-500 dark:bg-purple-500 md:mr-3"></span>
                <span class="hidden md:block">System Online</span>
            </div>

            <div class="flex gap-2 items-center">
                <button onclick="toggleDarkMode()" class="w-10 h-10 flex items-center justify-center text-xl text-gray-500 dark:text-purple-300/60 hover:text-black dark:hover:text-purple-300 transition-all active:scale-90 outline-none">
                    <span id="theme-icon" class="block pointer-events-none"></span>
                </button>
                <button onclick="logout()" class="text-[10px] uppercase tracking-[0.2em] text-gray-400 dark:text-purple-300/40 font-medium hover:text-red-500 px-2">Quitter</button>
            </div>
        </nav>

        <main class="max-w-4xl mx-auto mt-24 px-6 flex-grow w-full pb-32">
            <div class="flex flex-col gap-12">
                
                <div class="project-group flex flex-col md:flex-row gap-4 md:gap-0 cursor-pointer group">
                    <div class="project-date date-col text-gray-400 dark:text-purple-500/50 pt-1 font-mono text-[11px] tracking-tighter italic transition-colors duration-300">02.22.26 —</div>
                    <div class="flex-1">
                        <div class="project-item py-1 px-2 opacity-50 transition-all">
                            <span class="block font-medium dark:text-purple-200 text-sm mb-1 uppercase tracking-tight">Personal Website V1</span>
                            <span class="text-gray-500 dark:text-purple-300/40 text-[11px] leading-relaxed italic uppercase tracking-wider">Déploiement de l'interface et système d'accès sécurisé</span>
                        </div>
                    </div>
                </div>

                <div class="project-group flex flex-col md:flex-row gap-4 md:gap-0 cursor-pointer group">
                    <div class="project-date date-col text-gray-400 dark:text-purple-500/50 pt-1 font-mono text-[11px] tracking-tighter italic transition-colors duration-300">11.11.09 —</div>
                    <div class="flex-1">
                        <div class="project-item py-1 px-2 opacity-30 transition-all">
                            <span class="block font-medium dark:text-purple-200 text-sm mb-1 uppercase tracking-tight">Birth</span>
                            <span class="text-gray-500 dark:text-purple-300/40 text-[11px] leading-relaxed italic uppercase tracking-wider">Alex has spawned</span>
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <footer class="fixed bottom-0 left-0 w-full flex items-center px-6 py-8 text-[10px] text-gray-400 bg-[#f6f6f6]/95 dark:bg-[#0a0510]/95 backdrop-blur-md border-t border-gray-200 dark:border-purple-900/10 z-50">
            <div class="flex gap-4 font-medium flex-1"><span>© 2026 ALEX</span></div>
            <div class="absolute-center italic tracking-[0.5em] font-light text-gray-500 dark:text-purple-400/80 text-[12px]">a / k</div>
            <div class="flex-1 text-right"><span id="local-time" class="font-mono text-[11px] dark:text-purple-300/80">--:--:--</span></div>
        </footer>
    </div>

    <script>
        function updateThemeIcon(animate = false) {
            const themeIcon = document.getElementById('theme-icon');
            const isDark = document.documentElement.classList.contains('dark');
            if (animate) {
                themeIcon.classList.remove('theme-rotate');
                void themeIcon.offsetWidth; 
                themeIcon.classList.add('theme-rotate');
                setTimeout(() => {
                    themeIcon.innerHTML = isDark ? '&#9790;' : '&#9728;';
                }, 200);
            } else {
                themeIcon.innerHTML = isDark ? '&#9790;' : '&#9728;';
            }
        }

        window.onload = () => {
            updateThemeIcon(false);
            setTimeout(() => {
                document.getElementById('transition-layer').style.opacity = "0";
                document.getElementById('main-wrapper').classList.add('visible');
            }, 50);
        };

        function updateClock() { document.getElementById('local-time').textContent = new Date().toLocaleTimeString('fr-FR', { hour12: false }); }
        setInterval(updateClock, 1000); updateClock();

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon(true);
        }

        function logout() {
            document.getElementById('transition-layer').style.opacity = "1";
            document.getElementById('main-wrapper').style.opacity = "0";
            localStorage.removeItem('access_granted');
            setTimeout(() => { window.location.replace("index.html"); }, 400);
        }
    </script>
</body>
</html>
