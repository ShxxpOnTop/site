<!DOCTYPE html>
<html lang="fr" id="html-tag" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Alex | Index</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="https://img.icons8.com/ios-filled/512/8b5cf6/flash-on.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function applyTheme() {
            const currentTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.classList.toggle('dark', currentTheme === 'dark');
        }
        applyTheme();
        if (localStorage.getItem('access_granted') !== 'true') { window.location.replace("index.html"); }
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        * { transition: all 0.3s ease !important; }
        body { font-family: 'Inter', sans-serif; display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
        .logo-minimal { font-family: 'Playfair Display', serif; }
        .status-pulse { width: 7px; height: 7px; border-radius: 50%; animation: pulse 2s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }
        #transition-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; opacity: 1; }
    </style>
</head>
<body class="antialiased text-[13px] bg-[#f6f6f6] text-[#333] dark:bg-[#0a0510] dark:text-[#e9d5ff]">
    <div id="transition-layer" class="bg-[#f6f6f6] dark:bg-[#0a0510]"></div>
    <nav class="relative flex justify-between items-center px-6 h-24 sticky top-0 bg-white/80 dark:bg-[#0a0510]/80 backdrop-blur-md z-50 border-b border-gray-200 dark:border-purple-900/10">
        <div class="flex items-center gap-6">
            <div class="logo-minimal text-3xl font-normal dark:text-purple-400">Alex.</div>
            <div class="flex gap-4 text-[10px] uppercase tracking-[0.2em] font-medium">
                <a href="home.html" class="dark:text-white text-black border-b border-black dark:border-purple-500">Index</a>
                <a href="dashboard.html" class="text-gray-400 hover:text-purple-500">Dashboard</a>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleDarkMode()" class="w-10 h-10 flex items-center justify-center text-lg text-gray-400 dark:text-purple-300/40"><span id="theme-icon"></span></button>
            <button onclick="logout()" class="text-[10px] uppercase tracking-widest text-gray-400 hover:text-red-500 px-2">Exit</button>
        </div>
    </nav>
    <main class="max-w-4xl mx-auto mt-20 px-6 w-full flex-grow">
        <div class="space-y-12 pb-24">
            <div class="group flex flex-col md:flex-row gap-4">
                <div class="w-32 font-mono text-[11px] text-gray-400 dark:text-purple-500/50 italic">02.22.26 —</div>
                <div class="flex-1 opacity-50">
                    <span class="block text-sm uppercase font-medium">Personal Website V1</span>
                    <span class="text-[10px] uppercase tracking-widest text-gray-500 italic">Interface Deployment</span>
                </div>
            </div>
        </div>
    </main>
    <footer class="fixed bottom-0 left-0 w-full flex items-center px-6 py-8 text-[9px] text-gray-400 bg-white/90 dark:bg-[#0a0510]/90 backdrop-blur-md border-t border-gray-100 dark:border-purple-900/10 z-50">
        <div class="flex-1 font-mono">© 2026 ALEX</div>
        <div class="flex-1 text-right font-mono" id="local-time">--:--:--</div>
    </footer>
    <script>
        function updateThemeIcon() { document.getElementById('theme-icon').innerHTML = document.documentElement.classList.contains('dark') ? '&#9790;' : '&#9728;'; }
        function toggleDarkMode() { document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light'); updateThemeIcon(); }
        function updateClock() { document.getElementById('local-time').textContent = new Date().toLocaleTimeString('fr-FR', { hour12: false }); }
        window.onload = () => { updateThemeIcon(); updateClock(); setInterval(updateClock, 1000); setTimeout(() => { document.getElementById('transition-layer').style.opacity = "0"; }, 50); };
        function logout() { localStorage.removeItem('access_granted'); window.location.replace("index.html"); }
    </script>
</body>
</html>
