<!DOCTYPE html>
<html lang="fr" id="html-tag" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function applyTheme() {
            const currentTheme = localStorage.getItem('theme');
            if (currentTheme === 'light') { document.documentElement.classList.remove('dark'); }
            else { document.documentElement.classList.add('dark'); }
        }
        applyTheme();
        if (localStorage.getItem('access_granted') !== 'true') { window.location.replace("index.html"); }
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        * { transition: all 0.3s ease !important; }
        body { font-family: 'Inter', sans-serif; background-color: #0a0510; color: #e9d5ff; }
        .logo-minimal { font-family: 'Playfair Display', serif; }
        .stat-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(139, 92, 246, 0.1); padding: 1.5rem; border-radius: 4px; }
        
        /* Boutons ultra-discrets */
        .stealth-control { 
            opacity: 0.2; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 300;
            padding: 0 5px;
        }
        .stealth-control:hover { opacity: 1; color: #8b5cf6; }
        .stealth-control:active { transform: scale(0.8); }

        #transition-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; transition: opacity 0.4s ease-in-out !important; opacity: 1; }
    </style>
</head>
<body class="antialiased text-[13px] dark:bg-[#0a0510]">
    <div id="transition-layer" class="bg-[#f6f6f6] dark:bg-[#0a0510]"></div>
    <div class="min-h-screen flex flex-col">
        <nav class="flex justify-between items-center px-6 h-24 border-b border-purple-900/10 backdrop-blur-md">
            <div class="flex items-center gap-4">
                <div class="logo-minimal text-3xl font-normal dark:text-purple-400">Alex.</div>
                <div class="flex gap-4 text-[10px] uppercase tracking-[0.2em] font-medium">
                    <a href="home.html" class="text-gray-400 hover:text-white">Index</a>
                    <a href="#" class="text-white border-b border-purple-500">Dashboard</a>
                </div>
            </div>
            <button onclick="logout()" class="text-[10px] uppercase tracking-[0.2em] text-purple-300/40 hover:text-red-500">Quitter</button>
        </nav>

        <main class="max-w-5xl mx-auto w-full mt-12 px-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
                <div class="stat-card">
                    <div class="flex justify-between items-start mb-4">
                        <p class="text-[9px] uppercase tracking-widest text-gray-500">Balance</p>
                        <div class="flex gap-3">
                            <span onclick="updateValue('balance', -97)" class="stealth-control">−</span>
                            <span onclick="updateValue('balance', 97)" class="stealth-control">+</span>
                        </div>
                    </div>
                    <div class="text-4xl font-light tracking-tighter text-white"><span id="balance-val">0</span>€</div>
                </div>

                <div class="stat-card">
                    <div class="flex justify-between items-start mb-4">
                        <p class="text-[9px] uppercase tracking-widest text-gray-500">Net Profit</p>
                        <div class="flex gap-3">
                            <span onclick="updateValue('profit', -97)" class="stealth-control">−</span>
                            <span onclick="updateValue('profit', 97)" class="stealth-control">+</span>
                        </div>
                    </div>
                    <div class="text-4xl font-light tracking-tighter text-white"><span id="profit-val">0</span>€</div>
                </div>
            </div>
            
            <h3 class="text-[10px] uppercase tracking-[0.3em] text-gray-500 mb-4">Recent Operations</h3>
            <div id="transaction-list" class="space-y-2 border-t border-purple-900/10 pt-4">
                </div>
        </main>
    </div>

    <script>
        // Chargement des données sauvegardées
        let data = {
            balance: parseInt(localStorage.getItem('alex_balance')) || 12540,
            profit: parseInt(localStorage.getItem('alex_profit')) || 3200
        };

        function updateDisplay() {
            document.getElementById('balance-val').innerText = data.balance.toLocaleString();
            document.getElementById('profit-val').innerText = data.profit.toLocaleString();
            localStorage.setItem('alex_balance', data.balance);
            localStorage.setItem('alex_profit', data.profit);
        }

        function updateValue(type, amount) {
            data[type] += amount;
            if(data[type] < 0) data[type] = 0;
            updateDisplay();
            
            // Ajout au journal (Logs)
            const list = document.getElementById('transaction-list');
            const div = document.createElement('div');
            div.className = "flex justify-between py-3 border-b border-purple-900/5 hover:bg-white/5 px-2 transition-all";
            const dateStr = new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});
            
            div.innerHTML = `
                <span class="text-gray-500 font-mono text-[11px]">${dateStr}</span>
                <span class="uppercase tracking-widest text-[11px]">${type === 'balance' ? 'System Adj' : 'Profit Adj'}</span>
                <span class="${amount > 0 ? 'text-green-400' : 'text-red-400'} font-mono">${amount > 0 ? '+' : ''}${amount}.00€</span>
            `;
            list.prepend(div);
        }

        window.onload = () => {
            setTimeout(() => { document.getElementById('transition-layer').style.opacity = "0"; }, 50);
            updateDisplay();
        };

        function logout() {
            document.getElementById('transition-layer').style.opacity = "1";
            localStorage.removeItem('access_granted');
            setTimeout(() => { window.location.replace("index.html"); }, 400);
        }
    </script>
</body>
</html>
