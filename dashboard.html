<!DOCTYPE html>
<html lang="fr" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Alex | Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function applyTheme() {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.classList.toggle('dark', theme === 'dark');
        }
        applyTheme();
        if (localStorage.getItem('access_granted') !== 'true') { window.location.replace("index.html"); }
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        * { 
            transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                        color 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                        border-color 0.4s cubic-bezier(0.4, 0, 0.2, 1) !important;
            -webkit-font-smoothing: antialiased;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            display: flex; flex-direction: column; min-height: 100vh; margin: 0; 
            overflow-x: hidden; overscroll-behavior-y: none;
        }

        #main-wrapper { will-change: transform, opacity; backface-visibility: hidden; transform: translateZ(0); }

        .slide-in-right { 
            transform: translateX(100%) translateZ(0) !important; 
            opacity: 0 !important; 
            transition: transform 0.4s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.3s ease !important;
        }

        .stat-card { background: rgba(0, 0, 0, 0.03); border: 1px solid rgba(0, 0, 0, 0.05); padding: 1.5rem; border-radius: 4px; }
        .dark .stat-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(139, 92, 246, 0.1); }
        .stealth-control { opacity: 0.1; cursor: pointer; font-size: 18px; padding: 0 10px; user-select: none; }
        .stealth-control:hover { opacity: 1; color: #8b5cf6; }

        .notification {
            background: rgba(10, 5, 16, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .notification.show { opacity: 1; transform: translateY(0); }

        .logo-minimal { font-family: 'Playfair Display', serif; }
        .status-pulse { width: 6px; height: 6px; border-radius: 50%; animation: pulse 3s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        #transition-layer { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            pointer-events: none; z-index: 9999; opacity: 1; 
            background: inherit; transition: opacity 0.5s ease !important; 
        }
    </style>
</head>
<body class="antialiased text-[13px] bg-[#f6f6f6] text-[#333] dark:bg-[#0a0510] dark:text-[#e9d5ff]">
    
    <audio id="cha-ching" src="https://www.soundjay.com/misc/sounds/cash-register-05.mp3" preload="auto"></audio>
    
    <div id="transition-layer" class="bg-[#f6f6f6] dark:bg-[#0a0510]"></div>
    
    <div id="main-wrapper" class="flex flex-col min-h-screen transition-all duration-500">
        <nav class="relative flex justify-between items-center px-6 h-24 border-b border-gray-200 dark:border-purple-900/10 backdrop-blur-md sticky top-0 bg-[#f6f6f6]/80 dark:bg-[#0a0510]/80 z-50">
            <div class="flex items-center gap-4">
                <div class="logo-minimal text-3xl font-normal dark:text-purple-400">Alex.</div>
                <div class="flex gap-4 text-[10px] uppercase tracking-widest font-medium">
                    <a href="home.html" class="text-gray-400 hover:text-black dark:hover:text-white">Index</a>
                    <a href="#" class="text-black dark:text-white border-b border-black dark:border-purple-500">Dashboard</a>
                </div>
            </div>
            <div class="absolute left-1/2 -translate-x-1/2 hidden md:flex items-center text-[9px] uppercase tracking-[0.3em] text-green-600 dark:text-purple-400/60">
                <span class="status-pulse bg-green-500 dark:bg-purple-500 mr-2"></span> System Online
            </div>
            <div class="flex gap-2 items-center">
                <button onclick="toggleDarkMode()" class="w-10 h-10 flex items-center justify-center text-lg text-gray-400 dark:text-purple-300/40 active:scale-90"><span id="theme-icon"></span></button>
                <button onclick="logout()" class="text-[10px] text-gray-400 hover:text-red-500 uppercase tracking-widest px-2">Logout</button>
            </div>
        </nav>

        <main class="max-w-4xl mx-auto w-full mt-12 px-6 pb-40 flex-grow">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-16">
                <div class="stat-card">
                    <div class="flex justify-between items-start mb-2">
                        <p class="text-[9px] uppercase tracking-widest text-gray-400">Balance</p>
                        <div class="flex">
                            <span onclick="updateValue('balance', -97)" class="stealth-control">−</span>
                            <span onclick="updateValue('balance', 97)" class="stealth-control">+</span>
                        </div>
                    </div>
                    <div class="text-4xl font-light tracking-tighter dark:text-white text-black"><span id="balance-val">0</span>€</div>
                </div>
                <div class="stat-card">
                    <div class="flex justify-between items-start mb-2">
                        <p class="text-[9px] uppercase tracking-widest text-gray-400">Net Profit</p>
                        <div class="flex">
                            <span onclick="updateValue('profit', -97)" class="stealth-control">−</span>
                            <span onclick="updateValue('profit', 97)" class="stealth-control">+</span>
                        </div>
                    </div>
                    <div class="text-4xl font-light tracking-tighter dark:text-white text-black"><span id="profit-val">0</span>€</div>
                </div>
            </div>
            <div id="transaction-list" class="space-y-4 border-t border-gray-200 dark:border-purple-900/10 pt-4"></div>
        </main>

        <footer class="fixed bottom-0 left-0 w-full flex items-center px-6 py-8 text-[9px] text-gray-400 bg-[#f6f6f6]/95 dark:bg-[#0a0510]/95 backdrop-blur-md border-t border-gray-200 dark:border-purple-900/10 z-50">
            <div class="flex-1 font-mono uppercase tracking-widest">© 2026 ALEX</div>
            <div class="absolute left-1/2 -translate-x-1/2 italic tracking-[0.5em] text-[11px] text-black dark:text-purple-400/50">a / k</div>
            <div class="flex-1 text-right font-mono" id="local-time">--:--:--</div>
        </footer>
    </div>

    <div id="notification-container" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <script>
        // DONNÉES
        let data = { 
            balance: parseInt(localStorage.getItem('alex_balance')) || 12540, 
            profit: parseInt(localStorage.getItem('alex_profit')) || 3200 
        };
        let transactions = JSON.parse(localStorage.getItem('alex_transactions')) || [];

        // MISE À JOUR AFFICHAGE
        function updateDisplay() {
            document.getElementById('balance-val').innerText = data.balance.toLocaleString();
            document.getElementById('profit-val').innerText = data.profit.toLocaleString();
            const list = document.getElementById('transaction-list'); 
            list.innerHTML = '';
            transactions.forEach(tx => {
                const div = document.createElement('div'); 
                div.className = "flex justify-between py-4 border-b border-gray-100 dark:border-purple-900/5 px-2";
                div.innerHTML = `<span class="text-gray-400 font-mono text-[10px]">${tx.time}</span><span class="uppercase tracking-widest text-[10px]">${tx.label}</span><span class="${tx.amount > 0 ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'} font-mono">${tx.amount > 0 ? '+' : ''}${tx.amount}€</span>`;
                list.appendChild(div);
            });
        }

        // NOTIFICATIONS INTERNES (TOASTS)
        function notify(message) {
            const container = document.getElementById('notification-container');
            const toast = document.createElement('div');
            toast.className = 'notification';
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 3000);
        }

        // FONCTION UPDATE (AVEC DÉLAI 10S POUR SHOPIFY)
        function updateValue(type, amount) {
            data[type] += amount;
            const labelText = type === 'balance' ? 'System Adj' : 'Profit Adj';
            
            transactions.unshift({ 
                time: new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'}), 
                label: labelText, 
                amount: amount 
            });
            if(transactions.length > 15) transactions.pop();
            
            localStorage.setItem('alex_transactions', JSON.stringify(transactions));
            localStorage.setItem('alex_balance', data.balance); 
            localStorage.setItem('alex_profit', data.profit);
            
            updateDisplay();

            if (type === 'profit' && amount > 0) {
                // Feedback immédiat dans l'appli
                notify(`Processing Sale... (+${amount}€)`);

                // On capture les valeurs pour les 10s de délai
                const capturedAmount = amount;
                const capturedTotal = data.profit;

                setTimeout(() => {
                    // 1. Son Cha-ching
                    const audio = document.getElementById('cha-ching');
                    if(audio) { audio.currentTime = 0; audio.play().catch(()=>{}); }

                    // 2. Vibration (Nothing Phone)
                    if ("vibrate" in navigator) navigator.vibrate([100, 30, 100]);

                    // 3. Notification Système (Cumulable)
                    if (Notification.permission === "granted") {
                        navigator.serviceWorker.ready.then(reg => {
                            reg.showNotification('New Sale! 💸', {
                                body: `Received: +${capturedAmount}€\nTotal Profit: ${capturedTotal}€`,
                                icon: 'https://img.icons8.com/ios-filled/512/8b5cf6/flash-on.png',
                                badge: 'https://img.icons8.com/ios-filled/512/8b5cf6/flash-on.png',
                                vibrate: [100, 30, 100],
                                tag: 'sale-' + Date.now(), // Tag unique pour empiler les notifs
                                renotify: true
                            });
                        });
                    }
                }, 10000); // Délai de 10 secondes

            } else {
                notify(`${labelText}: ${amount > 0 ? '+' : ''}${amount}€`);
            }
        }

        function toggleDarkMode() { 
            const isDark = document.documentElement.classList.toggle('dark'); 
            localStorage.setItem('theme', isDark ? 'dark' : 'light'); 
            updateThemeIcon(); 
            notify(isDark ? "Dark Mode" : "Light Mode");
        }

        function updateThemeIcon() { 
            const icon = document.getElementById('theme-icon');
            if(icon) icon.innerHTML = document.documentElement.classList.contains('dark') ? '&#9790;' : '&#9728;'; 
        }

        window.onload = () => { 
            updateDisplay(); 
            updateThemeIcon(); 
            setInterval(() => {
                const clock = document.getElementById('local-time');
                if(clock) clock.textContent = new Date().toLocaleTimeString('fr-FR', { hour12: false });
            }, 1000); 
            setTimeout(() => { 
                const layer = document.getElementById('transition-layer');
                if(layer) layer.style.opacity = "0"; 
            }, 50); 
        };

        function logout() { localStorage.removeItem('access_granted'); window.location.replace("index.html"); }

        // Swipe pour retour
        let touchstartX = 0;
        document.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; }, false);
        document.addEventListener('touchend', e => { 
            if (e.changedTouches[0].screenX - touchstartX > 120) { 
                document.getElementById('main-wrapper').classList.add('slide-in-right');
                setTimeout(() => window.location.href = "home.html", 300);
            }
        }, false);
    </script>
</body>
</html>
