<!DOCTYPE html>
<html lang="fr" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Alex | Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (localStorage.getItem('access_granted') !== 'true') { window.location.replace("index.html"); }
        function applyTheme() {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.classList.toggle('dark', theme === 'dark');
        }
        applyTheme();
        tailwind.config = { darkMode: 'class' }

        let wakeLock = null;
        async function requestWakeLock() {
            try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); } } catch (err) {}
        }
        requestWakeLock();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    
    <style>
        * { transition: background-color 0.4s ease, color 0.4s ease; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; display: flex; flex-direction: column; min-height: 100vh; margin: 0; background: #f6f6f6; overflow-x: hidden; overscroll-behavior-y: none; }
        .dark body { background: #0a0510; }

        /* Animation de swipe */
        #main-wrapper { will-change: transform, opacity; transition: transform 0.4s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.3s ease; }
        .slide-out-right { transform: translateX(100%) !important; opacity: 0 !important; }

        .stat-card { background: rgba(0, 0, 0, 0.03); border: 1px solid rgba(0, 0, 0, 0.05); padding: 1.5rem; border-radius: 4px; }
        .dark .stat-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(139, 92, 246, 0.1); }
        .stealth-control { opacity: 0.1; cursor: pointer; font-size: 18px; padding: 0 10px; user-select: none; }
        .stealth-control:hover { opacity: 1; color: #8b5cf6; }
        
        .notification {
            background: rgba(10, 5, 16, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(139, 92, 246, 0.3);
            color: white; padding: 12px 24px; border-radius: 4px; font-size: 10px; text-transform: uppercase;
            letter-spacing: 0.2em; opacity: 0; transform: translateY(20px); transition: all 0.4s ease;
        }
        .notification.show { opacity: 1; transform: translateY(0); }
        
        #bulk-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-content { background: #f6f6f6; padding: 2rem; border-radius: 8px; width: 90%; max-width: 320px; }
        .dark .modal-content { background: #0a0510; border: 1px solid #8b5cf6; }
        
        #transition-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; opacity: 1; background: inherit; transition: opacity 0.5s ease; }
    </style>
</head>
<body class="antialiased text-[13px] text-[#333] dark:text-[#e9d5ff]">
    
    <div id="transition-layer" class="bg-[#f6f6f6] dark:bg-[#0a0510]"></div>
    
    <div id="bulk-modal">
        <div class="modal-content text-center text-black dark:text-white">
            <h2 class="text-[10px] uppercase tracking-widest mb-4">Mode Rafale</h2>
            <p class="text-[9px] opacity-50 mb-2">NOMBRE DE VENTES</p>
            <input type="number" id="bulk-count" value="10" class="w-full bg-transparent border-b border-purple-500 text-center text-2xl mb-6 outline-none font-light">
            <div class="flex gap-4">
                <button onclick="closeModal()" class="flex-1 text-[9px] uppercase tracking-widest opacity-50">Retour</button>
                <button onclick="startBulk()" class="flex-1 text-[9px] uppercase tracking-widest text-purple-500 font-bold">Lancer</button>
            </div>
        </div>
    </div>

    <div id="main-wrapper" class="flex flex-col min-h-screen">
        <nav class="relative flex justify-between items-center px-6 h-24 border-b border-gray-200 dark:border-purple-900/10 backdrop-blur-md sticky top-0 bg-[#f6f6f6]/80 dark:bg-[#0a0510]/80 z-50">
            <div class="flex items-center gap-4">
                <div class="font-serif text-3xl font-normal dark:text-purple-400">Alex.</div>
                <div class="flex gap-4 text-[10px] uppercase tracking-widest font-medium ml-4">
                    <a href="home.html" class="text-gray-400 hover:text-black dark:hover:text-white">Index</a>
                    <a href="#" class="text-black dark:text-white border-b border-black dark:border-purple-500">Dashboard</a>
                </div>
            </div>
            <div class="flex gap-2 items-center">
                <button onclick="openModal()" class="w-10 h-10 flex items-center justify-center opacity-40 hover:opacity-100 transition-opacity">⚙️</button>
                <button onclick="toggleDarkMode()" class="w-10 h-10 flex items-center justify-center text-lg text-gray-400 dark:text-purple-300/40 active:scale-90"><span id="theme-icon"></span></button>
                <button onclick="logout()" class="text-[10px] text-gray-400 hover:text-red-500 uppercase tracking-widest px-2">Logout</button>
            </div>
        </nav>

        <main class="max-w-4xl mx-auto w-full mt-12 px-6 pb-40 flex-grow">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-16">
                <div class="stat-card">
                    <div class="flex justify-between items-start mb-2"><p class="text-[9px] uppercase tracking-widest text-gray-400">Balance</p>
                        <div class="flex"><span onclick="updateValue('balance', -97)" class="stealth-control">−</span><span onclick="updateValue('balance', 97)" class="stealth-control">+</span></div>
                    </div>
                    <div class="text-4xl font-light tracking-tighter dark:text-white text-black"><span id="balance-val">0</span>€</div>
                </div>
                <div class="stat-card">
                    <div class="flex justify-between items-start mb-2"><p class="text-[9px] uppercase tracking-widest text-gray-400">Net Profit</p>
                        <div class="flex"><span onclick="updateValue('profit', -97)" class="stealth-control">−</span><span onclick="updateValue('profit', 97)" class="stealth-control">+</span></div>
                    </div>
                    <div class="text-4xl font-light tracking-tighter dark:text-white text-black"><span id="profit-val">0</span>€</div>
                </div>
            </div>
            <div id="transaction-list" class="space-y-4 border-t border-gray-200 dark:border-purple-900/10 pt-4"></div>
        </main>

        <footer class="fixed bottom-0 left-0 w-full flex items-center px-6 py-8 text-[9px] text-gray-400 bg-[#f6f6f6]/95 dark:bg-[#0a0510]/95 backdrop-blur-md border-t border-gray-200 dark:border-purple-900/10 z-50">
            <div class="flex-1 font-mono uppercase tracking-widest">© 2026 ALEX</div>
            <div class="flex-1 text-right font-mono" id="local-time">--:--:--</div>
        </footer>
    </div>

    <div id="notification-container" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <script>
        let data = { balance: parseInt(localStorage.getItem('alex_balance')) || 12540, profit: parseInt(localStorage.getItem('alex_profit')) || 3200 };
        let transactions = JSON.parse(localStorage.getItem('alex_transactions')) || [];

        function updateDisplay() {
            document.getElementById('balance-val').innerText = data.balance.toLocaleString();
            document.getElementById('profit-val').innerText = data.profit.toLocaleString();
            const list = document.getElementById('transaction-list'); list.innerHTML = '';
            transactions.forEach(tx => {
                const div = document.createElement('div'); div.className = "flex justify-between py-4 border-b border-gray-100 dark:border-purple-900/5 px-2";
                div.innerHTML = `<span class="text-gray-400 font-mono text-[10px]">${tx.time}</span><span class="uppercase tracking-widest text-[10px]">${tx.label}</span><span class="${tx.amount > 0 ? 'text-green-600' : 'text-red-600'} font-mono">${tx.amount > 0 ? '+' : ''}${tx.amount}€</span>`;
                list.appendChild(div);
            });
        }

        function openModal() { document.getElementById('bulk-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('bulk-modal').style.display = 'none'; }
        
        function startBulk() {
            const count = parseInt(document.getElementById('bulk-count').value);
            closeModal();
            let i = 0;
            function sendNext() {
                if (i < count) {
                    updateValue('profit', 97);
                    i++;
                    let randomDelay = Math.floor(Math.random() * (1000 - 150 + 1)) + 150; // Rafale plus nerveuse
                    setTimeout(sendNext, randomDelay);
                }
            }
            sendNext();
        }

        function updateValue(type, amount) {
            data[type] += amount;
            const labelText = type === 'balance' ? 'System Adj' : 'Profit Adj';
            transactions.unshift({ time: new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'}), label: labelText, amount: amount });
            if(transactions.length > 15) transactions.pop();
            localStorage.setItem('alex_balance', data.balance); localStorage.setItem('alex_profit', data.profit); localStorage.setItem('alex_transactions', JSON.stringify(transactions));
            updateDisplay();

            if (type === 'profit' && amount > 0) {
                const audio = new Audio('shopify.m4a?v=' + Date.now() + Math.random());
                audio.play().catch(() => {});
                
                if (Notification.permission === "granted") {
                    navigator.serviceWorker.ready.then(reg => {
                        reg.showNotification('New Order', {
                            body: `[ALEX VAULT] New order for 1 item totaling ${amount}.00€`,
                            icon: 'https://cdn-icons-png.flaticon.com/512/825/825561.png',
                            tag: 'sale-' + Date.now() + Math.random(),
                            renotify: true, silent: false, vibrate: [200, 100, 200],
                            priority: 'high', importance: 'high'
                        });
                    });
                }
            }
        }

        // --- GESTION DU SWIPE ---
        let touchstartX = 0;
        document.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; }, false);
        document.addEventListener('touchend', e => { 
            let touchendX = e.changedTouches[0].screenX;
            if (touchendX - touchstartX > 120) { // Swipe vers la DROITE
                document.getElementById('main-wrapper').classList.add('slide-out-right');
                setTimeout(() => window.location.href = "home.html", 300);
            }
        }, false);

        function toggleDarkMode() { 
            const isDark = document.documentElement.classList.toggle('dark'); 
            localStorage.setItem('theme', isDark ? 'dark' : 'light'); 
            updateThemeIcon(); 
        }

        function updateThemeIcon() { 
            const icon = document.getElementById('theme-icon');
            if(icon) icon.innerHTML = document.documentElement.classList.contains('dark') ? '&#9790;' : '&#9728;'; 
        }
        
        window.onload = () => { 
            updateDisplay(); updateThemeIcon();
            if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
            setTimeout(() => { document.getElementById('transition-layer').style.opacity = "0"; }, 50); 
            setInterval(() => { 
                const clock = document.getElementById('local-time');
                if(clock) clock.textContent = new Date().toLocaleTimeString('fr-FR'); 
            }, 1000);
        };
        function logout() { localStorage.removeItem('access_granted'); window.location.replace("index.html"); }
    </script>
</body>
</html>
