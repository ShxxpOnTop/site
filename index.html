<!DOCTYPE html>
<html lang="fr" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex | PS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        .date-col { min-width: 100px; font-variant-numeric: tabular-nums; }
        /* Empêche le contenu de se cacher derrière le footer fixe */
        main { padding-bottom: 80px; }
    </style>
</head>
<body class="antialiased text-[13px] bg-[#f6f6f6] text-[#333] dark:bg-[#121212] dark:text-[#eee]">

    <nav class="flex justify-between items-center px-6 py-4">
        <div class="font-medium">Alex.</div>
        <div class="flex gap-4 text-[11px] uppercase tracking-widest text-gray-500 dark:text-gray-400">
            <button onclick="toggleDarkMode()" class="hover:text-black dark:hover:text-white transition-colors">
                [ <span id="mode-text">Dark</span> ]
            </button>
            <a href="#" class="hover:text-black dark:hover:text-white">#</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto mt-20 px-6">
        <div class="flex flex-col gap-1">
            <div class="flex py-1 px-2 transition-colors duration-200 hover:bg-[#ededed] dark:hover:bg-[#1e1e1e]">
                <span class="date-col text-gray-500 dark:text-gray-500">02.22.26</span>
                <span class="flex-1">Mise en ligne de mon site</span>
            </div>
            <div class="flex py-1 px-2 transition-colors duration-200 hover:bg-[#ededed] dark:hover:bg-[#1e1e1e]">
                <span class="date-col text-gray-500 dark:text-gray-400">02.22.26</span>
                <span class="flex-1">Ajout du bouton Dark Mode 🌓</span>
            </div>
        </div>
    </main>

    <footer class="fixed bottom-0 w-full flex justify-between items-center px-6 py-4 text-[11px] text-gray-400 bg-[#f6f6f6] dark:bg-[#121212] border-t border-transparent dark:border-gray-800">
        <div>© 2026 Alex</div>
        <div class="italic">a/k</div>
        <div id="local-time">Heure Locale: --:--:--</div>
    </footer>

    <script>
        // 1. Fonction pour l'Heure
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('local-time').textContent = `Heure Locale: ${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1);
        updateClock();

        // 2. Fonction pour le Dark Mode
        function toggleDarkMode() {
            const html = document.getElementById('html-tag');
            const modeText = document.getElementById('mode-text');
            
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                modeText.textContent = 'Dark';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                modeText.textContent = 'Light';
                localStorage.setItem('theme', 'dark');
            }
        }

        // 3. Vérifier le choix précédent au chargement
        if (localStorage.getItem('theme') === 'dark') {
            document.getElementById('html-tag').classList.add('dark');
            document.getElementById('mode-text').textContent = 'Light';
        }
    </script>

</body>
</html>
