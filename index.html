<!DOCTYPE html>
<html lang="fr" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex | PS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            transition: background-color 0.5s ease, color 0.5s ease; 
            position: relative;
            min-height: 100vh;
        }
        
        /* L'effet de Grain */
        .grain::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.04; /* Ajuste l'intensité ici (0.04 - 0.07 c'est le top) */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .date-col { min-width: 100px; font-variant-numeric: tabular-nums; }
        main { padding-bottom: 80px; }
        
        .violet-glow {
            text-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
        }
    </style>
</head>
<body class="antialiased text-[13px] bg-[#f6f6f6] text-[#333] dark:bg-[#0a0510] dark:text-[#e9d5ff] grain">

    <nav class="relative z-10 flex justify-between items-center px-6 py-4">
        <div class="font-medium tracking-tighter dark:text-purple-400">Alex.</div>
        <div class="flex gap-4 text-[11px] uppercase tracking-widest text-gray-500 dark:text-purple-300/60">
            <button onclick="toggleDarkMode()" class="hover:text-black dark:hover:text-purple-300 transition-colors">
                [ <span id="mode-text">Dark</span> ]
            </button>
            <a href="#" class="hover:text-black dark:hover:text-purple-300">#</a>
        </div>
    </nav>

    <main class="relative z-10 max-w-4xl mx-auto mt-20 px-6">
        <div class="flex flex-col gap-1">
            
            <div class="flex py-1 px-2 transition-all duration-300 hover:bg-white/50 dark:hover:bg-purple-900/20 group cursor-default">
                <span class="date-col text-gray-400 dark:text-purple-500/50">02.22.26</span>
                <span class="flex-1 group-hover:translate-x-1 transition-transform">Initialisation du système</span>
            </div>

            <div class="flex py-1 px-2 transition-all duration-300 hover:bg-white/50 dark:hover:bg-purple-900/20 group cursor-default">
                <span class="date-col text-gray-400 dark:text-purple-500/50">02.22.26</span>
                <span class="flex-1 dark:text-purple-400 violet-glow">Texture & Grain activés ⚡</span>
            </div>

        </div>
    </main>

    <footer class="relative z-10 fixed bottom-0 w-full flex justify-between items-center px-6 py-4 text-[11px] text-gray-400 bg-[#f6f6f6]/80 backdrop-blur-md dark:bg-[#0a0510]/80 dark:text-purple-300/50 border-t border-transparent dark:border-purple-900/20">
        <div>© 2026 Alex</div>
        <div class="italic tracking-widest">a/k</div>
        <div id="local-time" class="font-mono">--:--:--</div>
    </footer>

    <script>
        // HORLOGE
        function updateClock() {
            const now = new Date();
            document.getElementById('local-time').textContent = now.toLocaleTimeString('fr-FR', { hour12: false });
        }
        setInterval(updateClock, 1);
        updateClock();

        // DARK MODE
        const html = document.getElementById('html-tag');
        const modeText = document.getElementById('mode-text');

        function toggleDarkMode() {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                modeText.textContent = 'Dark';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                modeText.textContent = 'Light';
                localStorage.setItem('theme', 'dark');
            }
        }

        if (localStorage.getItem('theme') === 'dark') {
            html.classList.add('dark');
            modeText.textContent = 'Light';
        }
    </script>

</body>
</html>
