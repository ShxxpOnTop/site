<!DOCTYPE html>
<html lang="fr" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex | PS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            transition: background-color 0.4s ease, color 0.4s ease; 
        }
        .date-col { min-width: 100px; font-variant-numeric: tabular-nums; }
        main { padding-bottom: 100px; }
        
        .violet-glow {
            text-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
        }

        /* Scrollbar minimaliste pour le mode sombre */
        .dark::-webkit-scrollbar { width: 5px; }
        .dark::-webkit-scrollbar-track { background: #0a0510; }
        .dark::-webkit-scrollbar-thumb { background: #1e1b2e; border-radius: 10px; }
    </style>
</head>
<body class="antialiased text-[13px] bg-[#f6f6f6] text-[#333] dark:bg-[#0a0510] dark:text-[#e9d5ff]">

    <nav class="flex justify-between items-center px-6 py-4 sticky top-0 bg-[#f6f6f6]/80 dark:bg-[#0a0510]/80 backdrop-blur-md z-50">
        <div class="font-medium tracking-tighter dark:text-purple-400 text-base">Alex.</div>
        <div class="flex gap-4 text-[11px] uppercase tracking-widest text-gray-500 dark:text-purple-300/60">
            <button onclick="toggleDarkMode()" class="hover:text-black dark:hover:text-purple-300 transition-colors">
                [ <span id="mode-text">Dark</span> ]
            </button>
            <a href="#" class="hover:text-black dark:hover:text-purple-300 transition-colors">#</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto mt-20 px-6">
        <div class="flex flex-col gap-10">
            
            <div class="flex flex-col md:flex-row gap-2 md:gap-0">
                <div class="date-col text-gray-400 dark:text-purple-500/50 pt-1 font-medium">02.22.26</div>
                
                <div class="flex-1 flex flex-col gap-1">
                    <div class="py-1 px-2 transition-all duration-200 hover:bg-black/5 dark:hover:bg-purple-900/20 group rounded-sm cursor-default">
                        <span class="group-hover:translate-x-1 inline-block transition-transform italic">Mise en ligne du site (V3)</span>
                    </div>
                    <div class="py-1 px-2 transition-all duration-200 hover:bg-black/5 dark:hover:bg-purple-900/20 group rounded-sm cursor-default">
                        <span class="dark:text-purple-400 violet-glow group-hover:translate-x-1 inline-block transition-transform">Épuration du design : retrait du grain</span>
                    </div>
                    <div class="py-1 px-2 transition-all duration-200 hover:bg-black/5 dark:hover:bg-purple-900/20 group rounded-sm cursor-default text-blue-500 dark:text-purple-400 underline decoration-purple-500/30 underline-offset-4">
                        <span class="group-hover:translate-x-1 inline-block transition-transform">Lien vers un projet externe</span>
                    </div>
                </div>
            </div>

            <div class="flex flex-col md:flex-row gap-2 md:gap-0">
                <div class="date-col text-gray-400 dark:text-purple-500/50 pt-1 font-medium">02.21.26</div>
                <div class="flex-1 flex flex-col gap-1">
                    <div class="py-1 px-2 transition-all duration-200 hover:bg-black/5 dark:hover:bg-purple-900/20 group rounded-sm cursor-default text-gray-400">
                        <span class="group-hover:translate-x-1 inline-block transition-transform">Développement du Dark Mode Violet</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="fixed bottom-0 w-full flex justify-between items-center px-6 py-6 text-[10px] text-gray-400 bg-[#f6f6f6]/90 dark:bg-[#0a0510]/90 backdrop-blur-md border-t border-gray-200/50 dark:border-purple-900/20">
        <div class="flex gap-4">
            <span>© 2026 ALEX</span>
            <a href="mailto:ton@email.com" class="hover:text-black dark:hover:text-purple-300">CONTACT</a>
        </div>
        <div class="italic tracking-[0.2em] font-light">A/K</div>
        <div id="local-time" class="font-mono tabular-nums tracking-tighter text-[11px]">--:--:--</div>
    </footer>

    <script>
        // HORLOGE
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('fr-FR', { 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: false 
            });
            document.getElementById('local-time').textContent = timeString;
        }
        setInterval(updateClock, 1);
        updateClock();

        // DARK MODE
        const html = document.getElementById('html-tag');
        const modeText = document.getElementById('mode-text');

        function toggleDarkMode() {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                modeText.textContent = 'Dark';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                modeText.textContent = 'Light';
                localStorage.setItem('theme', 'dark');
            }
        }

        // Init thème
        if (localStorage.getItem('theme') === 'dark') {
            html.classList.add('dark');
            modeText.textContent = 'Light';
        }
    </script>

</body>
</html>
