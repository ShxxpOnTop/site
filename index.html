<!DOCTYPE html>
<html lang="fr" id="html-tag" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Alex | Vault</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="https://img.icons8.com/ios-filled/512/8b5cf6/flash-on.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/512/8b5cf6/flash-on.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <script>
        function applyTheme() {
            const currentTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.classList.toggle('dark', currentTheme === 'dark');
        }
        applyTheme();
        if (localStorage.getItem('access_granted') === 'true') { window.location.replace("home.html"); }
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        * { transition: all 0.3s ease !important; }
        body { font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        .logo-minimal { font-family: 'Playfair Display', serif; }
        #transition-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; opacity: 1; }
    </style>
</head>
<body class="h-screen flex items-center justify-center bg-[#f6f6f6] text-[#333] dark:bg-[#0a0510] dark:text-[#e9d5ff]">
    <div class="absolute top-6 right-6">
        <button onclick="toggleDarkMode()" class="w-10 h-10 flex items-center justify-center text-xl text-gray-400 dark:text-purple-300/40 active:scale-90"><span id="theme-icon"></span></button>
    </div>
    <div id="transition-layer" class="bg-[#f6f6f6] dark:bg-[#0a0510]"></div>
    <div id="main-content" class="text-center space-y-8 w-64">
        <h1 class="logo-minimal text-4xl italic tracking-tighter dark:text-purple-400">Alex.</h1>
        <div class="space-y-4">
            <input type="password" id="password" placeholder="CODE" class="w-full bg-transparent border-b border-gray-300 dark:border-purple-900/50 py-2 outline-none text-center focus:border-purple-500 text-sm placeholder:text-gray-400/30">
            <button onclick="checkAccess()" class="text-[10px] uppercase tracking-[0.3em] text-gray-400 dark:text-purple-300/30 hover:text-purple-500">Enter</button>
        </div>
        <p id="error" class="text-red-500 text-[10px] hidden uppercase tracking-widest">Denied</p>
    </div>
    <script>
        function updateThemeIcon() { document.getElementById('theme-icon').innerHTML = document.documentElement.classList.contains('dark') ? '&#9790;' : '&#9728;'; }
        function toggleDarkMode() { document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light'); updateThemeIcon(); }
        window.onload = () => { updateThemeIcon(); setTimeout(() => { document.getElementById('transition-layer').style.opacity = "0"; }, 50); };
        function checkAccess() {
            if(document.getElementById('password').value === '1234') {
                localStorage.setItem('access_granted', 'true');
                window.location.replace("home.html");
            } else {
                const err = document.getElementById('error'); err.classList.remove('hidden');
                setTimeout(() => err.classList.add('hidden'), 2000);
            }
        }
        document.getElementById('password').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAccess(); });
    </script>
</body>
</html>
