<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex | Accès</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    <script>
        // SCRIPT ANTI-BOUCLE : Si le badge est présent, on saute direct au portfolio
        if (localStorage.getItem('access_granted') === 'true') {
            window.location.replace("home.html");
        }
    </script>
    <style>
        body { background-color: #0a0510; font-family: sans-serif; }
        .logo-minimal { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="h-screen flex items-center justify-center text-[#e9d5ff] overflow-hidden">

    <div class="text-center space-y-8 w-64">
        <h1 class="logo-minimal text-4xl italic tracking-tighter">Alex.</h1>
        
        <div class="space-y-4">
            <input type="password" id="password" placeholder="Code d'accès" 
                class="w-full bg-transparent border-b border-purple-900/50 py-2 outline-none text-center focus:border-purple-500 transition-colors text-sm">
            
            <button onclick="checkAccess()" 
                class="text-[10px] uppercase tracking-[0.3em] text-purple-300/40 hover:text-purple-300 transition-colors cursor-pointer">
                Entrer
            </button>
        </div>
        
        <p id="error" class="text-red-500 text-[10px] hidden uppercase tracking-widest">Code incorrect</p>
    </div>

    <script>
        function checkAccess() {
            const pass = document.getElementById('password').value;
            // TON CODE ICI
            if(pass === '1234') {
                localStorage.setItem('access_granted', 'true');
                window.location.replace("home.html");
            } else {
                const err = document.getElementById('error');
                err.classList.remove('hidden');
                setTimeout(() => err.classList.add('hidden'), 2000);
            }
        }
        // Valider avec Entrée
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAccess();
        });
    </script>
</body>
</html>
