<!DOCTYPE html>
<html lang="fr" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex | PS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            transition: background-color 0.5s ease, color 0.5s ease; 
        }
        .date-col { min-width: 100px; font-variant-numeric: tabular-nums; }
        main { padding-bottom: 80px; }
        
        /* Petit effet de lueur sur le texte violet en mode dark */
        .dark .violet-glow {
            text-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
        }
    </style>
</head>
<body class="antialiased text-[13px] bg-[#f6f6f6] text-[#333] dark:bg-[#0a0510] dark:text-[#e9d5ff]">

    <nav class="flex justify-between items-center px-6 py-4">
        <div class="font-medium tracking-tighter dark:text-purple-400">Alex.</div>
        <div class="flex gap-4 text-[11px] uppercase tracking-widest text-gray-500 dark:text-purple-300/60">
            <button onclick="toggleDarkMode()" class="hover:text-black dark:hover:text-purple-300 transition-colors">
                [ <span id="mode-text">Dark</span> ]
            </button>
            <a href="#" class="hover:text-black dark:hover:text-purple-300">#</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto mt-20 px-6">
        <div class="flex flex-col gap-1">
            
            <div class="flex py-1 px-2 transition-all duration-300 hover:bg-white/50 dark:hover:bg-purple-900/20 group">
                <span class="date-col text-gray-400 dark:text-purple-500/50">02.22.26</span>
                <span class="flex-1 group-hover:translate-x-1 transition-transform">Mise en ligne du site</span>
            </div>

            <div class="flex py-1 px-2 transition-all duration-300 hover:bg-white/50 dark:hover:bg-purple-900/20 group">
                <span class="date-col text-gray-400 dark:text-purple-500/50">02.22.26</span>
                <span class="flex-1 dark:text-purple-400 violet-glow">Activation de la "Midnight Vibe" 💜</span>
            </div>

        </div>
    </main>

    <footer class="fixed bottom-0 w-full flex justify-between items-center px-6 py-4 text-[11px] text-gray-400 bg-[#f6f6f6]/80 backdrop-blur-md dark:bg-[#0a0510]/80 dark:text-purple-300/50 border-t border-transparent dark:border-purple-900/30">
        <div>© 2026 Alex</div>
        <div class="italic tracking-widest">a/k</div>
        <div id="local-time" class="font-mono">--:--:--</div>
    </footer>

    <script>
        // HEURE DYNAMIQUE
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('local-time').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1);
        updateClock();

        // GESTION DU DARK MODE
        const html = document.getElementById('html-tag');
        const modeText = document.getElementById('mode-text');

        function toggleDarkMode() {
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                modeText.textContent = 'Dark';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                modeText.textContent = 'Light';
                localStorage.setItem('theme', 'dark');
            }
        }

        // Garder le thème au rafraîchissement
        if (localStorage.getItem('theme') === 'dark') {
            html.classList.add('dark');
            modeText.textContent = 'Light';
        }
    </script>

</body>
</html>
