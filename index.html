<!DOCTYPE html>
<html lang="fr" id="html-tag" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex | Accès</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <script>
        if (localStorage.getItem('theme') === 'light') { document.documentElement.classList.remove('dark'); }
        if (localStorage.getItem('access_granted') === 'true') { window.location.replace("home.html"); }
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        * { transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease !important; }
        body { font-family: 'Inter', sans-serif; overflow: hidden; }
        .logo-minimal { font-family: 'Playfair Display', serif; }
        
        #transition-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 9999;
            transition: opacity 0.6s ease-in-out !important; opacity: 1;
        }

        /* Animation du contenu */
        .fade-in-up {
            opacity: 0; transform: translateY(10px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out !important;
        }
        .fade-in-up.visible { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="h-screen flex items-center justify-center bg-[#f6f6f6] text-[#333] dark:bg-[#0a0510] dark:text-[#e9d5ff]">

    <div id="transition-layer" class="bg-[#f6f6f6] dark:bg-[#0a0510]"></div>

    <nav class="fixed top-0 right-0 p-8">
        <button onclick="toggleDarkMode()" class="text-[10px] uppercase tracking-[0.2em] text-gray-500 dark:text-purple-300/60 font-medium hover:text-black dark:hover:text-purple-300">
            [ <span id="mode-text">Dark</span> ]
        </button>
    </nav>

    <div id="main-content" class="fade-in-up text-center space-y-8 w-64">
        <h1 class="logo-minimal text-4xl italic tracking-tighter dark:text-purple-400">Alex.</h1>
        <div class="space-y-4">
            <input type="password" id="password" placeholder="Code d'accès" 
                class="w-full bg-transparent border-b border-gray-300 dark:border-purple-900/50 py-2 outline-none text-center focus:border-purple-500 text-sm">
            <button onclick="checkAccess()" 
                class="text-[10px] uppercase tracking-[0.3em] text-gray-400 dark:text-purple-300/40 hover:text-black dark:hover:text-purple-300 cursor-pointer">
                Entrer
            </button>
        </div>
        <p id="error" class="text-red-500 text-[10px] hidden uppercase tracking-widest">Code incorrect</p>
    </div>

    <script>
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('transition-layer').style.opacity = "0";
                document.getElementById('main-content').classList.add('visible');
            }, 100);
        };

        async function checkAccess() {
            if(document.getElementById('password').value === '1234') {
                document.getElementById('transition-layer').style.opacity = "1";
                document.getElementById('main-content').style.opacity = "0";
                localStorage.setItem('access_granted', 'true');
                setTimeout(() => { window.location.replace("home.html"); }, 600);
            } else {
                const err = document.getElementById('error');
                err.classList.remove('hidden');
                setTimeout(() => err.classList.add('hidden'), 2000);
            }
        }
        function toggleDarkMode() {
            const isDark = document.getElementById('html-tag').classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('mode-text').textContent = isDark ? 'Light' : 'Dark';
        }
        document.getElementById('mode-text').textContent = document.documentElement.classList.contains('dark') ? 'Light' : 'Dark';
        document.getElementById('password').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAccess(); });
    </script>
</body>
</html>
