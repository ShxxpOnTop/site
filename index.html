<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Portfolio | Inspiré par Matthew Park</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #fcfcfc; color: #1a1a1a; }
        .project-card { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .project-card:hover { transform: translateY(-8px); filter: grayscale(0); }
        .project-card img { filter: grayscale(100%); transition: filter 0.5s ease; }
        .project-card:hover img { filter: grayscale(0%); }
    </style>
</head>
<body class="antialiased">

    <nav class="flex justify-between items-center px-8 py-12 max-w-7xl mx-auto">
        <div class="text-xl font-medium tracking-tighter">VOTRE NOM</div>
        <div class="space-x-8 text-sm font-medium text-gray-500">
            <a href="#" class="hover:text-black transition">Projets</a>
            <a href="#" class="hover:text-black transition">À propos</a>
            <a href="#" class="hover:text-black transition">Contact</a>
        </div>
    </nav>

    <header class="px-8 py-20 max-w-7xl mx-auto">
        <h1 class="text-5xl md:text-8xl font-medium tracking-tighter leading-[0.9] mb-8">
            Designer Digital <br/> 
            <span class="text-gray-400">basé à Paris.</span>
        </h1>
        <p class="max-w-md text-gray-500 text-lg">
            Je crée des expériences minimalistes et des interfaces centrées sur l'utilisateur.
        </p>
    </header>

    <main class="px-8 pb-32 max-w-7xl mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
            
            <div class="project-card group cursor-pointer">
                <div class="bg-gray-100 aspect-[4/5] overflow-hidden rounded-sm mb-4">
                    <img src="https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&q=80&w=1000" alt="Projet" class="w-full h-full object-cover">
                </div>
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="text-xl font-medium tracking-tight">Application de Fitness</h3>
                        <p class="text-gray-400 text-sm">UI/UX Design • 2024</p>
                    </div>
                    <span class="text-2xl group-hover:translate-x-1 transition-transform">→</span>
                </div>
            </div>

            <div class="project-card group cursor-pointer md:mt-24">
                <div class="bg-gray-100 aspect-[4/5] overflow-hidden rounded-sm mb-4">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&q=80&w=1000" alt="Projet" class="w-full h-full object-cover">
                </div>
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="text-xl font-medium tracking-tight">Identité Visuelle</h3>
                        <p class="text-gray-400 text-sm">Branding • 2023</p>
                    </div>
                    <span class="text-2xl group-hover:translate-x-1 transition-transform">→</span>
                </div>
            </div>

        </div>
    </main>

    <footer class="px-8 py-12 border-t border-gray-100 max-w-7xl mx-auto flex justify-between text-sm text-gray-400">
        <p>© 2024 Votre Nom. Fait avec passion.</p>
        <div class="flex space-x-6">
            <a href="#" class="hover:underline">LinkedIn</a>
            <a href="#" class="hover:underline">Twitter</a>
        </div>
    </footer>

</body>
</html>
