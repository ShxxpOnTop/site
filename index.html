<!DOCTYPE html>
<html lang="fr" id="html-tag" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex | Accès</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <script>
        function applyTheme() {
            const currentTheme = localStorage.getItem('theme');
            if (currentTheme === 'light') { document.documentElement.classList.remove('dark'); }
            else { document.documentElement.classList.add('dark'); }
        }
        applyTheme();
        if (localStorage.getItem('access_granted') === 'true') { window.location.replace("home.html"); }
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        * { transition: background-color 0.3s ease, color 0.3s ease !important; }
        body { font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; }
        .logo-minimal { font-family: 'Playfair Display', serif; }
        #transition-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; transition: opacity 0.4s ease-in-out !important; opacity: 1; }
        .fade-in-up { opacity: 0; transform: translateY(8px); transition: opacity 0.5s ease-out, transform 0.5s ease-out !important; }
        .fade-in-up.visible { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="h-screen flex items-center justify-center bg-[#f6f6f6] text-[#333] dark:bg-[#0a0510] dark:text-[#e9d5ff]">
    <div id="transition-layer" class="bg-[#f6f6f6] dark:bg-[#0a0510]"></div>
    <div id="main-content" class="fade-in-up text-center space-y-8 w-64">
        <h1 class="logo-minimal text-4xl italic tracking-tighter dark:text-purple-400">Alex.</h1>
        <div class="space-y-4">
            <input type="password" id="password" placeholder="Code d'accès" class="w-full bg-transparent border-b border-gray-300 dark:border-purple-900/50 py-2 outline-none text-center focus:border-purple-500 text-sm placeholder:text-gray-400/50 dark:placeholder:text-purple-300/20">
            <button onclick="checkAccess()" class="text-[10px] uppercase tracking-[0.3em] text-gray-400 dark:text-purple-300/40 hover:text-black dark:hover:text-purple-300 cursor-pointer block mx-auto">Entrer</button>
        </div>
        <p id="error" class="text-red-500 text-[10px] hidden uppercase tracking-widest">Code incorrect</p>
    </div>
    <script>
        window.onload = () => { setTimeout(() => { document.getElementById('transition-layer').style.opacity = "0"; document.getElementById('main-content').classList.add('visible'); }, 50); };
        async function checkAccess() {
            if(document.getElementById('password').value === '1234') {
                document.getElementById('transition-layer').style.opacity = "1";
                localStorage.setItem('access_granted', 'true');
                setTimeout(() => { window.location.replace("home.html"); }, 400);
            } else {
                const err = document.getElementById('error'); err.classList.remove('hidden');
                setTimeout(() => err.classList.add('hidden'), 2000);
            }
        }
        document.getElementById('password').addEventListener('keypress', (e) => { if (e.key === 'Enter') checkAccess(); });
    </script>
</body>
</html>
